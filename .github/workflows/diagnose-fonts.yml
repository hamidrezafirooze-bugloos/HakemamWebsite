name: Diagnose deployed fonts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-fonts.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends sshpass

      - name: Inspect deployed files
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no p09@65.109.208.86"
          {
            echo "=== timestamp ==="
            date -u
            echo
            echo "=== font files on server ==="
            $SSH "ls -la /srv/www/p09/assets/ | grep -iE 'shabnam|vazirmatn|woff' || echo NONE_FOUND"
            echo
            echo "=== index.html on server ==="
            $SSH "cat /srv/www/p09/index.html"
            echo
            echo "=== font-family refs in deployed CSS ==="
            $SSH "grep -o 'font-family:[^;}]*' /srv/www/p09/assets/index-*.css || echo NO_CSS_MATCH"
            echo
            echo "=== live HTTP check from the server itself ==="
            $SSH "curl -s -o /dev/null -w 'HTTP %{http_code}\n' https://p09.65.109.208.86.sslip.io/ || true"
            echo
            echo "=== live HTTP check for a shabnam font file ==="
            $SSH "SHABNAM_FILE=\$(ls /srv/www/p09/assets/ | grep -i shabnam-400 | head -1); echo \"file: \$SHABNAM_FILE\"; curl -s -o /dev/null -w 'HTTP %{http_code}\n' \"https://p09.65.109.208.86.sslip.io/assets/\$SHABNAM_FILE\""
          } > diagnostic-output.txt
          cat diagnostic-output.txt

      - name: Commit diagnostic output
        run: |
          git config user.name "diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostic-output.txt
          git commit -m "Add font deploy diagnostic output" || echo "nothing to commit"
          git push

name: Discover server web root

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-server.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Probe server (Caddy)
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no p09@65.109.208.86 '
            echo "== Caddyfile =="
            cat /etc/caddy/Caddyfile 2>&1

            echo
            echo "== Caddyfile includes (if any import directive is used) =="
            grep -i "^\s*import" /etc/caddy/Caddyfile 2>/dev/null
            ls -la /etc/caddy/ 2>&1
            for f in /etc/caddy/sites-enabled/* /etc/caddy/conf.d/* /etc/caddy/sites/*; do
              [ -f "$f" ] && echo "--- $f ---" && cat "$f"
            done 2>/dev/null

            echo
            echo "== home dir listing (top level + one deep) =="
            ls -la /home/p09
            find /home/p09 -maxdepth 2 -type d 2>/dev/null

            echo
            echo "== caddy process cwd / open files (best effort) =="
            ls -la /proc/$(pgrep -o caddy)/cwd 2>/dev/null

            echo
            echo "== any index.* on the whole accessible filesystem under /home and /srv and /opt =="
            for d in /home/p09 /srv /opt; do
              [ -d "$d" ] && find "$d" -maxdepth 6 -iname "index.*" 2>/dev/null
            done
          '

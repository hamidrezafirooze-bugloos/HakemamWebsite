name: Diagnose Zino route

on:
  push:
    paths:
      - '.github/workflows/diagnose-zino.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Curl checks against live site
        run: |
          echo "=== GET /zino (headers) ===" > zino-diagnostic.txt
          curl -sSL -D - -o /dev/null https://p09.65.109.208.86.sslip.io/zino >> zino-diagnostic.txt || echo "CURL FAILED" >> zino-diagnostic.txt
          echo "" >> zino-diagnostic.txt
          echo "=== GET /zino (no-follow, raw status) ===" >> zino-diagnostic.txt
          curl -sSI https://p09.65.109.208.86.sslip.io/zino >> zino-diagnostic.txt || echo "CURL FAILED" >> zino-diagnostic.txt
          echo "" >> zino-diagnostic.txt
          echo "=== GET /zino/ (headers) ===" >> zino-diagnostic.txt
          curl -sSI https://p09.65.109.208.86.sslip.io/zino/ >> zino-diagnostic.txt || echo "CURL FAILED" >> zino-diagnostic.txt
          echo "" >> zino-diagnostic.txt
          echo "=== GET /zino/ (body title check) ===" >> zino-diagnostic.txt
          curl -sSL https://p09.65.109.208.86.sslip.io/zino/ | grep -o '<title>[^<]*</title>' >> zino-diagnostic.txt || echo "GREP FAILED" >> zino-diagnostic.txt
          cat zino-diagnostic.txt

      - name: Commit result
        run: |
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"
          git add zino-diagnostic.txt
          git commit -m "diagnostic: zino live-route curl check" || echo "no changes to commit"
          git push

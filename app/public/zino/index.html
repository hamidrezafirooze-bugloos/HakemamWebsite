&lt;style&gt;
:root{
  --navy900:#0A0819; --navy800:#110F26; --navy700:#0E1330; --navy600:#171634;
  --indigo:#2C3A94; --azure:#128FCD; --sky:#2AA0E0; --cyan:#14ADE6; --pale:#BBDEF4;
  --ink:#EAF0FA; --mut:#8C93B8; --line:rgba(255,255,255,.08);
  --grad:linear-gradient(120deg,#2C3A94,#128FCD);
  --f:&quot;Poppins&quot;,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--navy800);color:var(--ink);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.05}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--azure)}
.mut{color:var(--mut)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;backdrop-filter:blur(10px);background:rgba(17,15,38,0);transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
nav.solid{background:rgba(12,10,25,.72);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:20px}
.brand svg{width:26px;height:23px}
.navlinks{display:flex;gap:26px;font-size:14px;color:var(--mut)}
.navlinks .switch{padding:5px 14px;border:1px solid var(--line);border-radius:40px;color:var(--ink)}
.navlinks .switch:hover{border-color:rgba(62,169,230,.5)}
.navlinks a:hover{color:var(--ink)}
@media(max-width:720px){.navlinks{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:96px 20px 120px}
.bg{position:absolute;inset:0;z-index:0;background:radial-gradient(120% 90% at 50% 10%,#1b1c46 0%,var(--navy800) 45%,var(--navy900) 100%)}
.pat{position:absolute;inset:-10%;width:120%;height:120%;opacity:.06;z-index:0;animation:heartbeat 1.8s ease-in-out infinite}
@keyframes heartbeat{0%,100%{opacity:.06}50%{opacity:0}}
.hero .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.logostage{position:relative;width:min(64vw,440px);aspect-ratio:700/536;margin-bottom:48px}
@media(max-height:760px){.hero{padding:80px 20px 110px}.logostage{width:min(48vw,300px);margin-bottom:28px}.hero .eyebrow{margin-bottom:14px}.hero .sub{margin-top:12px}}
@media(max-height:600px){.hero{padding:64px 20px 100px}.logostage{width:min(38vw,220px);margin-bottom:18px}.scroll{bottom:16px}}
.logostage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lock .hwm,.lock .hps{opacity:0}
.lock .hwm{animation:rise .9s cubic-bezier(.2,.8,.2,1) 2.05s forwards}
.lock .hps{animation:rise .9s cubic-bezier(.2,.8,.2,1) 2.28s forwards}
.flourish{opacity:.5}
.flourish .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.4s ease .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sym .piece{transform-box:fill-box;transform-origin:center;opacity:0}
.sym .pieceA{animation:inA 1.1s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
.sym .pieceB{animation:inB 1.1s cubic-bezier(.2,.8,.2,1) 1.35s forwards}
@keyframes inA{from{opacity:0;transform:translate(-60px,-70px) rotate(-14deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translate(70px,72px) rotate(14deg) scale(.9)}to{opacity:1;transform:none}}
.hero h1{font-size:clamp(30px,5vw,60px);font-weight:600;max-width:14ch;opacity:0;animation:rise .9s ease 2s forwards}
.hero .sub{margin-top:18px;max-width:46ch;color:var(--mut);font-size:clamp(15px,1.6vw,18px);font-weight:300;opacity:0;animation:rise .9s ease 2.2s forwards}
.hero .eyebrow{opacity:0;animation:rise .9s ease 1.85s forwards;margin-bottom:22px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.scroll{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut);opacity:0;text-align:center;animation:scrollRise 1s ease 2.6s forwards}
@keyframes scrollRise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}
.scroll::after{content:&quot;&quot;;display:block;width:1px;height:34px;margin:12px auto 0;background:linear-gradient(var(--azure),transparent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}

/* sections */
section{position:relative;padding:clamp(90px,13vh,150px) 0}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}
.tag{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--azure);margin-bottom:20px}

/* concept */
.concept h2{font-size:clamp(28px,4.4vw,52px);max-width:18ch;font-weight:500}
.concept .lead{margin-top:26px;max-width:56ch;font-size:clamp(17px,2vw,21px);color:#c7cde6;font-weight:300}
.concept .lead b{color:#fff;font-weight:600}

/* construction */
.constr{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
@media(max-width:820px){.constr{grid-template-columns:1fr;gap:36px}}
.stage{position:relative;aspect-ratio:461/404;width:100%;max-width:440px;margin:0 auto;background:radial-gradient(80% 80% at 50% 45%,#181a44,transparent 70%);border-radius:24px}
.stage svg{position:absolute;inset:8%;width:84%;height:84%;overflow:visible}
.stage .piece{transform-box:fill-box;transform-origin:center;transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity 1s ease;opacity:.001}
.stage .pieceA{transform:translate(-14%,-16%) rotate(-10deg)}
.stage .pieceB{transform:translate(14%,16%) rotate(10deg)}
.stage.in .piece{opacity:1;transform:none}
.stage.in .pieceB{transition-delay:.18s}

/* system / lockups */
.grid{display:grid;gap:20px}
.lockgrid{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.lockgrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.lockgrid{grid-template-columns:1fr}}
.card{background:var(--navy600);border:1px solid var(--line);border-radius:20px;padding:34px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:210px;transition:transform .5s,border-color .5s}
.card:hover{transform:translateY(-4px);border-color:rgba(62,169,230,.4)}
.card .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.lk-vert{display:flex;flex-direction:column;align-items:center;gap:10px}
.lk-vert svg{width:64px;height:56px}
.lk-horiz{display:flex;align-items:center;gap:14px}
.lk-horiz svg{width:52px;height:46px}
.wm{font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:.8}
.wm small{display:block;font-weight:300;font-size:8.5px;letter-spacing:.42em;color:var(--mut);margin-top:6px;text-transform:lowercase}
.card.onwhite{background:#fff} .card.onwhite .lab{color:#7a7f96}
.card.onblue{background:var(--indigo)}
.card svg .symMono path{}

/* color */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:720px){.swatches{grid-template-columns:1fr 1fr}}
.sw{border-radius:18px;padding:20px;height:170px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);transform:scale(.94);opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s}
.sw.in{transform:scale(1);opacity:1}
.sw .hex{font-size:13px;font-weight:500;letter-spacing:.04em} .sw .nm{font-size:12px;opacity:.7;margin-top:2px}

/* type */
.typewrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:center}
@media(max-width:820px){.typewrap{grid-template-columns:1fr;gap:28px}}
.aa{font-size:clamp(120px,20vw,240px);font-weight:700;line-height:.8;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.specimen .z{font-weight:700;font-size:clamp(40px,7vw,84px);letter-spacing:-.03em}
.specimen .z small{display:block;font-weight:300;font-size:clamp(11px,1.6vw,15px);letter-spacing:.5em;color:var(--mut);margin-top:10px}
.wt{display:flex;gap:24px;flex-wrap:wrap;margin-top:26px;color:var(--mut);font-size:14px}
.wt b{color:var(--ink);font-weight:600}
.wt .l{font-weight:300}.wt .m{font-weight:500}.wt .b{font-weight:700}

/* applications */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:end}
@media(max-width:820px){.apps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.apps{grid-template-columns:1fr}}
.phone{background:linear-gradient(180deg,#14173a,#0d1030);border:1px solid var(--line);border-radius:34px;padding:14px;aspect-ratio:9/15;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.screen{position:relative;background:linear-gradient(180deg,#0f1230,#0b0d24);border-radius:24px;height:100%;padding:20px 16px 30px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.screen::after{content:&quot;&quot;;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:34%;height:4px;border-radius:3px;background:rgba(255,255,255,.16)}
.tabbar{margin-top:auto;display:flex;justify-content:space-around;align-items:center;padding:12px 6px 6px;border-top:1px solid var(--line)}
.tabbar span{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.08)}
.tabbar span.on{background:var(--grad)}
.notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}
.s-top{display:flex;align-items:center;gap:8px;margin-top:6px}
.s-top svg{width:22px;height:20px} .s-top .hi{font-size:12px;color:var(--mut)} .s-top .nm{font-weight:600;font-size:14px}
.tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .t{font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.tile .v{font-size:13px;font-weight:600;margin-top:4px}
.pill{background:var(--grad);color:#fff;border-radius:12px;padding:11px;text-align:center;font-size:12px;font-weight:600}
.ring svg{width:120px;height:120px;display:block;margin:2px auto}
.ring .rv{fill:#fff;font-size:22px;font-weight:700} .ring .rl{fill:var(--mut);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.appnote{grid-column:1/-1;text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
.chip{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:20px;font-size:11px;color:var(--mut)}

/* footer */
footer{position:relative;text-align:center;padding:clamp(90px,14vh,160px) 0 70px;overflow:hidden}
.foot-sym{width:96px;height:84px;margin:0 auto 26px}
.bigmark{font-size:clamp(60px,15vw,180px);font-weight:700;letter-spacing:-.04em;line-height:.8;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigmark small{display:block;-webkit-text-fill-color:var(--mut);color:var(--mut);font-weight:300;font-size:clamp(11px,1.6vw,16px);letter-spacing:.55em;margin-top:16px}
.cta{display:inline-block;margin-top:40px;background:var(--grad);color:#fff;font-weight:600;font-size:15px;padding:15px 34px;border-radius:40px;transition:transform .3s,box-shadow .3s;box-shadow:0 16px 40px -16px rgba(18,143,205,.7)}
.cta:hover{transform:translateY(-3px);box-shadow:0 22px 50px -16px rgba(18,143,205,.9)}
.micro{margin-top:40px;color:var(--mut);font-size:12px;letter-spacing:.04em}
.divider{height:1px;background:var(--line);max-width:1180px;margin:0 auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} .sym .piece,.stage .piece,.sw,.reveal,.hero h1,.hero .sub,.hero .eyebrow{opacity:1!important;transform:none!important} .scroll{opacity:1!important;transform:translateX(-50%)!important} .flourish .ln{stroke-dashoffset:0!important} .lock .hwm,.lock .hps{opacity:1!important}}

/* traced wordmark uses */
.zh,.zs,.zp{display:block;width:auto}
.nav-wm{height:17px;width:auto;display:block}
.lkH .zh{height:22px} .lkH .zp{height:8px;margin-top:5px}
.lkV .zs{height:50px} .lkV .zp{height:8px;margin-top:8px}
.lkcol{display:flex;flex-direction:column;align-items:center}
.type-wm .zh{height:70px} .type-wm .zp{height:16px;margin-top:14px}
.foot-wm .zh{height:clamp(56px,13vw,150px)} .foot-wm .zp{height:clamp(11px,1.6vw,16px);margin-top:16px}

/* applications: real device */
.appstage{display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:center}
@media(max-width:820px){.appstage{grid-template-columns:1fr;gap:40px;justify-items:center;text-align:center}}
.phonewrap{position:relative;display:flex;justify-content:center}
.phonewrap::before{content:&quot;&quot;;position:absolute;inset:-6% -14%;background:radial-gradient(closest-side,rgba(18,143,205,.38),rgba(44,58,148,.18) 55%,transparent 72%);filter:blur(34px);z-index:0}
.phoneimg{position:relative;z-index:1;width:min(70vw,310px);height:auto;filter:drop-shadow(0 44px 70px rgba(0,0,0,.6));animation:floaty 6.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.feat{list-style:none;display:flex;flex-direction:column;gap:22px;margin-top:28px}
@media(max-width:820px){.feat{text-align:left;display:inline-flex}}
.feat li{display:flex;gap:16px;align-items:flex-start}
.feat .fi{flex:none;width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 12px 26px -12px rgba(18,143,205,.75)}
.feat b{color:#fff;font-weight:600;font-size:16px}
.feat .ft{color:var(--mut);font-weight:300;font-size:14.5px;margin-top:2px}

    &lt;p class=&quot;sub&quot;&gt;A patient-support identity built on a single idea: two people reaching toward one another.&lt;/p&gt;

&lt;section id=&quot;concept&quot; class=&quot;concept&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;tag reveal&quot;&gt;The idea&lt;/div&gt;
  &lt;h2 class=&quot;reveal d1&quot;&gt;Two shapes that lean into each other.&lt;/h2&gt;
  &lt;p class=&quot;lead reveal d2&quot;&gt;Zino&#x27;s mark is two blades that meet in the middle: a &lt;b&gt;patient&lt;/b&gt; and a &lt;b&gt;supporter&lt;/b&gt;. Read together they form a &lt;b&gt;Z&lt;/b&gt;; read closely they become a &lt;b&gt;figure with open arms&lt;/b&gt;. It&#x27;s a logo about being lifted, not just treated.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;construction&quot;&gt;&lt;div class=&quot;wrap constr&quot;&gt;
  &lt;div class=&quot;reveal&quot;&gt;
    &lt;div class=&quot;tag&quot;&gt;Built to interlock&lt;/div&gt;
    &lt;h2 style=&quot;font-size:clamp(26px,3.6vw,40px);font-weight:500;max-width:14ch&quot;&gt;One shape, mirrored and turned.&lt;/h2&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:20px;font-size:17px;color:#c7cde6;font-weight:300;max-width:44ch&quot;&gt;Each blade hooks into its twin, with a soft offset echo behind it for depth, support that&#x27;s always moving toward you. Scroll to watch them lock.&lt;/p&gt;

.social .top .b{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center} .social .top .b img{width:20px;filter:brightness(0) invert(1)}
.social .banner{background:var(--grad);padding:44px 22px;display:flex;align-items:center;justify-content:center}
.social .banner span{background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:20px;padding:12px 20px;border-radius:16px;backdrop-filter:blur(4px)}
.social .acts{display:flex;gap:16px;padding:14px 16px;color:var(--mut)}
/* footer */
footer{text-align:center;padding:clamp(90px,13vh,150px) 0 70px;position:relative;overflow:hidden}
footer .rings2{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:520px;aspect-ratio:1;pointer-events:none;opacity:.5}
footer .rings2 span{position:absolute;inset:0;margin:auto;border:1px solid rgba(41,171,226,.22);border-radius:50%;animation:ripple 6s ease-out infinite}
footer .rings2 span:nth-child(2){animation-delay:2s} footer .rings2 span:nth-child(3){animation-delay:4s}
.foot-mark{width:min(70vw,300px);height:auto;position:relative;z-index:2}
.cta{display:inline-block;margin-top:34px;background:var(--grad);color:#fff;font-weight:600;padding:15px 34px;border-radius:40px;position:relative;z-index:2;box-shadow:0 16px 40px -16px rgba(0,114,188,.8);transition:transform .3s}
.cta:hover{transform:translateY(-3px)}
.micro{margin-top:32px;color:var(--mut);font-size:12px;position:relative;z-index:2}
.family{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:12px;color:var(--mut);position:relative;z-index:2}
.family a{color:var(--blue2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} .hero .mark,.chips,.hero h1,.hero .sub,.hero .eyebrow,.reveal{opacity:1!important;transform:none!important} .scroll{opacity:1!important;transform:translateX(-50%)!important}}


/* hero: full logo base (letters complete), blue figure fills in top-left -&gt; bottom-right */
.markstage{position:relative;width:min(64vw,320px);aspect-ratio:760/704;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
@media(max-height:760px){.hero{padding:64px 20px 90px}.markstage{width:min(48vw,220px)}.chips{margin-top:16px}.hero h1{margin-top:16px}.hero .sub{margin-top:10px}}
@media(max-height:600px){.hero{padding:56px 20px 76px}.markstage{width:min(36vw,160px)}.hero .eyebrow{margin-bottom:12px}.chips{margin-top:12px}.hero h1{margin-top:12px}.hero .sub{margin-top:8px}.scroll{bottom:14px}}
.markstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mk-base{opacity:0;animation:baseIn .9s ease .2s forwards}
@keyframes baseIn{to{opacity:1}}
.mk-fig{opacity:1;
  -webkit-mask-image:linear-gradient(135deg,#000 0%,#000 var(--r1,0%),transparent var(--r2,0%),transparent 100%);
          mask-image:linear-gradient(135deg,#000 0%,#000 var(--r1,0%),transparent var(--r2,0%),transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:fillFig 1.7s cubic-bezier(.4,0,.2,1) 1s forwards}
@keyframes fillFig{0%{--r1:0%;--r2:8%}100%{--r1:100%;--r2:108%}}
@property --r1{syntax:&#x27;&lt;percentage&gt;&#x27;;inherits:false;initial-value:0%}
@property --r2{syntax:&#x27;&lt;percentage&gt;&#x27;;inherits:false;initial-value:8%}
@media(prefers-reduced-motion:reduce){.mk-base{opacity:1!important;animation:none!important}.mk-fig{-webkit-mask-image:none!important;mask-image:none!important;animation:none!important}}
 .mk-fig{-webkit-mask-image:none!important;mask-image:none!important;animation:none!important}}

&lt;section id=&quot;concept&quot;&gt;&lt;div class=&quot;wrap concept&quot;&gt;
  &lt;div class=&quot;reveal&quot;&gt;
    &lt;div class=&quot;tag&quot;&gt;The idea&lt;/div&gt;
    &lt;h2&gt;A person, lifted.&lt;/h2&gt;
    &lt;p&gt;At the heart of the mark is a figure with &lt;b&gt;arms open to the sky&lt;/b&gt;, hope, recovery, relief. Beneath, a wave carries them: the &lt;b&gt;support&lt;/b&gt; that never lets go. The letters and the person become one, because care and the people it serves are inseparable.&lt;/p&gt;
